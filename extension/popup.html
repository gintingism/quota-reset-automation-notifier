<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Gemini Web Quota Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81z"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">Gemini Quota Sync</h1>
        <div class="brand-sub"><span id="geminiPlanBadge">gemini.google.com/usage</span></div>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Pilih bahasa / Select language">
        <button type="button" class="lang-btn is-active" data-lang="id">ID</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <a id="dashboardLink" class="icon-btn" href="https://gemini.google.com/usage" target="_blank" rel="noreferrer" title="Buka gemini.google.com/usage">
        <i data-lucide="external-link"></i>
      </a>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Tampilan">
    <button type="button" class="tab-btn is-active" data-tab="status" role="tab" aria-selected="true">
      <i data-lucide="activity"></i>
      <span data-i18n="tabStatus">Status</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings" role="tab" aria-selected="false">
      <i data-lucide="sliders-horizontal"></i>
      <span data-i18n="tabSettings">Pengaturan</span>
    </button>
  </nav>

  <main id="panel-status" class="panel" role="tabpanel">
    <div class="status-bar">
      <div class="status-pill">
        <span id="syncDot" class="dot"></span>
        <span id="syncStatus" class="status-text num">Worker: —</span>
      </div>
      <a id="openWorkerBtn" class="link-btn" href="#" target="_blank" rel="noreferrer" hidden>
        <span data-i18n="openDashboard">Dashboard</span>
        <i data-lucide="arrow-up-right"></i>
      </a>
    </div>

    <section class="card ring-card" aria-label="Kuota Sesi 5 Jam">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 68 68" aria-hidden="true">
          <circle class="ring-track" cx="34" cy="34" r="28" />
          <circle id="dailyRing" class="ring-fill" cx="34" cy="34" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93" />
        </svg>
        <div class="ring-center">
          <span id="daily" class="ring-pct num">—</span>
          <span class="ring-unit" data-i18n="unitLeft">sisa</span>
        </div>
      </div>
      <div class="card-meta">
        <div class="card-label-row">
          <span class="card-title">
            <i data-lucide="gauge"></i>
            <span data-i18n="session5hTitle">Sesi 5h</span>
          </span>
          <span id="dailyBadge" class="badge num">—</span>
        </div>
        <div id="dailyCountdown" class="countdown-val num">—</div>
        <div class="meta-line">
          <i data-lucide="clock"></i>
          <span id="dailyReset" class="num">Reset: —</span>
        </div>
        <div class="meta-line">
          <i data-lucide="trending-up"></i>
          <span id="dailyPace" class="num">—</span>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Kuota Mingguan">
      <div class="bar-header">
        <span class="card-title">
          <i data-lucide="calendar-days"></i>
          <span data-i18n="weeklyTitle">Mingguan</span>
        </span>
        <span id="weekly" class="bar-value num">—</span>
      </div>
      <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="weeklyBar" class="bar-fill"></div>
      </div>
      <div class="split-meta">
        <div class="meta-line">
          <i data-lucide="clock"></i>
          <span id="weeklyReset" class="num">Reset: —</span>
        </div>
        <span id="weeklyCountdown" class="badge num">—</span>
      </div>
      <div class="meta-line" style="margin-top:5px;">
        <i data-lucide="trending-up"></i>
        <span id="weeklyPace" class="num">—</span>
      </div>
    </section>

    <section id="antigravityCard" class="card" aria-label="Kuota Antigravity" hidden>
      <div class="overview-header">
        <span class="provider-brand">
          <span class="provider-logo is-ag" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L3.5 20.5h3.8l1.9-4.3h5.6l1.9 4.3h3.8L12 2zm-1.6 10.8L12 8.9l1.6 3.9h-3.2zM12 15.8a6.5 6.5 0 0 1-5.6-3.2l-1.5 1a8.2 8.2 0 0 0 14.2 0l-1.5-1A6.5 6.5 0 0 1 12 15.8z"/>
            </svg>
          </span>
          <span class="card-title">Antigravity</span>
        </span>
        <span id="agTier" class="badge num">—</span>
      </div>
      <div id="agRows"></div>
    </section>

    <section id="copilotCard" class="card" aria-label="Kuota GitHub Copilot" hidden>
      <div class="overview-header">
        <span class="provider-brand">
          <span class="provider-logo is-gh" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12z"/>
            </svg>
          </span>
          <span class="card-title">GitHub Copilot</span>
        </span>
        <span id="copilotPlan" class="badge num">—</span>
      </div>
      <div class="bar-header" style="margin-bottom:6px;">
        <span id="copilotCredits" class="muted num">—</span>
        <span id="copilotPctBadge" class="badge num">—</span>
      </div>
      <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="copilotBar" class="bar-fill"></div>
      </div>
      <div class="split-meta">
        <div class="meta-line">
          <i data-lucide="clock"></i>
          <span data-i18n="monthlyResetLabel">Reset bulanan</span>
        </div>
        <span id="copilotCountdown" class="badge num overview-timer">—</span>
      </div>
    </section>

    <button id="syncBtn" type="button" class="btn btn-primary">
      <i data-lucide="refresh-cw" id="syncIcon"></i>
      <span id="syncBtnLabel" data-i18n="btnSyncNow">Sinkronkan sekarang</span>
    </button>

    <div id="lastScraped" class="footer-note num">Auto-sync 15m aktif</div>
  </main>

  <section id="panel-settings" class="panel" role="tabpanel" hidden>
    <div class="card">
      <div class="field">
        <label class="field-label" for="workerUrl">Cloudflare Worker URL</label>
        <div class="input-wrap">
          <input id="workerUrl" class="input" type="url" placeholder="https://....workers.dev" autocomplete="off" />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="authToken">X-Auth-Token</label>
        <div class="input-wrap">
          <input id="authToken" class="input has-trailing" type="password" placeholder="e.g. qra-9f4a2c8e..." autocomplete="off" />
          <button id="toggleTokenBtn" type="button" class="input-toggle" title="Tampilkan atau sembunyikan token" aria-label="Tampilkan token">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <button id="saveBtn" type="button" class="btn btn-secondary">
        <i data-lucide="save"></i>
        <span id="saveBtnLabel" data-i18n="btnSaveSettings">Simpan pengaturan</span>
      </button>
    </div>

    <div class="footer-note" data-i18n="storageNote">Token disimpan lokal di chrome.storage.local</div>
  </section>

  <script src="vendor/lucide.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
